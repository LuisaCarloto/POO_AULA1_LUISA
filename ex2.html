<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de temperatura</title>
    <script>
        class Termostato {
            constructor() {
                this.temperatura = 20;
            }
            aumentarTemp() {
                this.temperatura++ // aumenta 1 C

                if (this.temperatura > 35) {
                    console.log("Temperatura acima do limite!!");
                    this.temperatura = 35;
                }
            }
            diminuirTemp() {
                this.temperatura--;

                if (this.temperatura < 10) {
                    console.log("Temperatura muito baixa!!");
                    this.temperatura = 10;
                }
            }
            status(){     //serve para mostrar como o termostato tá     
                console.log("Temperatura atual:" + this.temperatura + "°C")
            }
        }

        let termostato = new Termostato();
        termostato.status();

        //para aumentar a temp
        termostato.aumentarTemp();
        termostato.status();

        //agr pra diminuir
        termostato.diminuirTemp();
        termostato.status();

    </script>
</head>

<body>

</body>

</html>
